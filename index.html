<!DOCTYPE html>
<html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARO STORE</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center}
.header{padding:20px;background:#111;border-bottom:2px solid gold}
.logo{font-size:40px;font-weight:900;color:gold}
.btn{background:gold;color:#000;padding:15px 25px;border:none;border-radius:30px;font-weight:900;margin:8px;cursor:pointer;display:inline-block;text-decoration:none}
.card{background:#151515;border:1px solid #333;padding:20px;border-radius:20px;margin:15px}
input{width:90%;padding:14px;margin:8px;background:#222;color:#fff;border:1px solid #444;border-radius:12px}
.product{border:1px solid gold;padding:15px;margin:10px;border-radius:15px}
</style></head><body>
<div class="header">
<div class="logo">MARO STORE</div>
<div>فودافون كاش: 01030980823</div>
<a class="btn" href="https://wa.me/201030980823">واتساب MARO</a>
</div>

<div class="card">
<h2 style="color:gold">🛒 منتجات MARO</h2>
<div class="product">
<b>🔥 متابعين انستا VIP</b><br>
1000 متابع = 25 جنيه<br>
<button class="btn" onclick="order('متابعين انستا')">اطلب الان</button>
</div>
<div class="product">
<b>🎵 متابعين تيك توك</b><br>
1000 متابع = 30 جنيه<br>
<button class="btn" onclick="order('متابعين تيك توك')">اطلب الان</button>
</div>
<div class="product">
<b>👁️ مشاهدات + لايكات</b><br>
1000 = 15 جنيه<br>
<button class="btn" onclick="order('مشاهدات')">اطلب الان</button>
</div>
</div>

<div class="card">
<h3 style="color:gold">📝 اطلب الان</h3>
<input id="email" placeholder="ايميلك">
<input id="link" placeholder="رابط حسابك">
<input id="qty" type="number" placeholder="الكمية">
<button class="btn" onclick="sendOrder()">🚀 ارسال الطلب لـ MARO</button>
<p id="msg"></p>
</div>

<div class="card">
<h3>👑 دخول الادمن</h3>
<input id="pass" type="password" placeholder="كلمة السر">
<button class="btn" onclick="login()">دخول</button>
<div id="admin" style="display:none">
<p style="color:gold">مرحبا MARO - لوحة التحكم شغالة ✅</p>
<p>الطلبات هتجيلك على واتساب 01030980823</p>
</div>
</div>

<script>
function order(name){
document.getElementById('email').scrollIntoView({behavior:'smooth'});
document.getElementById('msg').innerHTML='اخترت: <b style="color:gold">'+name+'</b> - اكتب بياناتك تحت';
}
function sendOrder(){
if(!email.value||!link.value)return alert('اكتب ايميلك والرابط');
let text='طلب جديد MARO%0Aالخدمة: متابعين%0Aالايميل: '+email.value+'%0Aالرابط: '+link.value+'%0Aالكمية: '+qty.value;
window.open('https://wa.me/201030980823?text='+text,'_blank');
document.getElementById('msg').innerHTML='<b style="color:#25D366">✅ تم - افتح واتساب واكمل</b>';
}
function login(){
if(pass.value==='Maro123'){
document.getElementById('admin').style.display='block';
}else alert('الباسورد غلط - جرب Maro123');
}
</script>
</body></html>
