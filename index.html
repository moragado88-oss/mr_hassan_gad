<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maro Store - SMM Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--border:#2a2e39;--primary:#6c5ce7;--green:#00b894;--text:#fff;--muted:#9aa0b0}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:var(--bg);color:var(--text);min-height:100vh}
.header{padding:16px 20px;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px;color:var(--primary)}
.btn{padding:10px 18px;border-radius:10px;border:0;cursor:pointer;font-weight:700}
.btn-primary{background:var(--primary);color:#fff}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.container{max-width:1100px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#11131a;color:#fff;margin-top:8px}
.service{border:1px solid var(--border);border-radius:12px;padding:14px}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;background:#2d3436}
.hidden{display:none}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow:auto}
.tab{padding:10px 16px;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:var(--card)}
.tab.active{background:var(--primary);border-color:var(--primary)}
</style>
</head>
<body>
<div class="header">
<div class="logo">MARO STORE 🔥</div>
<div id="authArea">
<button class="btn btn-ghost" onclick="showAuth('login')">دخول</button>
<button class="btn btn-primary" onclick="showAuth('signup')">حساب جديد</button>
</div>
<div id="userArea" class="hidden">
<span id="userEmail" style="margin-left:10px;color:var(--muted)"></span>
<span id="userBalance" style="margin-left:10px;color:var(--green);font-weight:800"></span>
<button class="btn btn-ghost" onclick="logout()">خروج</button>
</div>
</div>
<div class="container">
<div id="authCard" class="card">
<h2 id="authTitle">تسجيل الدخول</h2>
<input id="email" class="input" placeholder="moragado88@gmail.com">
<input id="password" class="input" type="password" placeholder="الباسورد">
<div style="margin-top:12px;display:flex;gap:8px">
<button class="btn btn-primary" style="flex:1" onclick="handleAuth()">دخول</button>
<button class="btn btn-ghost" onclick="toggleAuthMode()">حساب جديد؟</button>
</div>
<p id="authMsg" style="margin-top:10px;color:#ff7675"></p>
</div>
<div id="mainApp" class="hidden">
<div class="tabs">
<div class="tab active" onclick="switchTab('services',event)">🛒 الخدمات</div>
<div class="tab" onclick="switchTab('orders',event)">📦 طلباتي</div>
<div class="tab" id="adminTabBtn" onclick="switchTab('admin',event)" style="display:none">👑 لوحة الأدمن</div>
</div>
<div id="tab-services">
<div class="card"><h3>اطلب خدمة جديدة</h3>
<div class="grid" style="margin-top:12px">
<div><label>الخدمة</label><select id="serviceSelect" class="input"></select></div>
<div><label>الرابط</label><input id="orderLink" class="input" placeholder="https://..."></div>
<div><label>الكمية</label><input id="orderQty" type="number" class="input" placeholder="1000"></div>
<div><label>السعر</label><input id="orderPrice" class="input" disabled></div>
</div>
<button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="createOrder()">تأكيد الطلب ✅</button>
<p id="orderMsg"></p>
</div>
<div id="servicesList" class="grid"></div>
</div>
<div id="tab-orders" class="hidden"><div class="card"><h3>طلباتي</h3><div id="ordersList"></div></div></div>
<div id="tab-admin" class="hidden">
<div class="card"><h3>إضافة خدمة جديدة</h3>
<div class="grid">
<input id="s_name" class="input" placeholder="اسم الخدمة">
<input id="s_category" class="input" placeholder="التصنيف - instagram">
<input id="s_price" type="number" step="0.01" class="input" placeholder="سعر الألف">
<input id="s_min" type="number" class="input" placeholder="أقل كمية">
<input id="s_max" type="number" class="input" placeholder="أكبر كمية">
</div>
<textarea id="s_desc" class="input" placeholder="وصف الخدمة"></textarea>
<button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="addService()">إضافة الخدمة ➕</button>
<p id="adminMsg"></p>
</div>
<div class="card"><h3>كل الطلبات (أدمن)</h3><div id="allOrdersList"></div></div>
</div>
</div>
</div>
<script>
const SUPABASE_URL = "https://okikwjwccskqgququowa.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9raWt3andjY3NrcWdxdXF1b3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3MTcyMjMsImV4cCI6MjEwOTI5MzIyM30.6PJlnTrfQm4c74G7FXKuGLJsWaT_bdlOVQtjSBby4bw";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let authMode='login',currentUser=null,currentProfile=null,services=[];
function showAuth(m){document.getElementById('authCard').classList.remove('hidden');authMode=m;document.getElementById('authTitle').innerText=m==='login'?'تسجيل الدخول':'إنشاء حساب جديد'}
function toggleAuthMode(){authMode=authMode==='login'?'signup':'login';showAuth(authMode)}
async function handleAuth(){
 const email=document.getElementById('email').value.trim();
 const pass=document.getElementById('password').value;
 const msg=document.getElementById('authMsg');msg.innerText='...';
 try{
  let res=authMode==='login'?await supabaseClient.auth.signInWithPassword({email,password:pass}):await supabaseClient.auth.signUp({email,password:pass});
  if(res.error) throw res.error;
  msg.style.color='#00b894';msg.innerText='تم ✅';checkUser();
 }catch(e){msg.style.color='#ff7675';msg.innerText=e.message;}
}
async function checkUser(){
 const {data:{user}}=await supabaseClient.auth.getUser();if(!user)return;
 currentUser=user;
 document.getElementById('authCard').classList.add('hidden');
 document.getElementById('authArea').classList.add('hidden');
 document.getElementById('userArea').classList.remove('hidden');
 document.getElementById('mainApp').classList.remove('hidden');
 document.getElementById('userEmail').innerText=user.email;
 const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',user.id).single();
 if(profile){currentProfile=profile;document.getElementById('userBalance').innerText=(profile.balance||0)+' $';if(profile.role==='admin')document.getElementById('adminTabBtn').style.display='block';}
 loadServices();loadOrders();
}
async function logout(){await supabaseClient.auth.signOut();location.reload();}
async function loadServices(){
 const {data}=await supabaseClient.from('services').select('*').order('id');services=data||[];
 const sel=document.getElementById('serviceSelect');sel.innerHTML='';const list=document.getElementById('servicesList');list.innerHTML='';
 services.forEach(s=>{const opt=document.createElement('option');opt.value=s.id;opt.textContent=`${s.name} - $${s.price_per_1000}/1000`;sel.appendChild(opt);
 const div=document.createElement('div');div.className='service card';div.innerHTML=`<b>${s.name}</b> <span class="badge">${s.category||''}</span><p style="color:var(--muted);margin-top:6px">${s.description||''}</p>`;list.appendChild(div);});
 sel.onchange=calcPrice;document.getElementById('orderQty').oninput=calcPrice;calcPrice();
}
function calcPrice(){const sel=document.getElementById('serviceSelect');const qty=document.getElementById('orderQty').value;if(!sel.value||!qty)return;const srv=services.find(x=>x.id==sel.value);const price=(qty/1000)*parseFloat(srv.price_per_1000);document.getElementById('orderPrice').value=price.toFixed(2)+' $';}
async function createOrder(){
 const service_id=document.getElementById('serviceSelect').value;const link=document.getElementById('orderLink').value.trim();const quantity=parseInt(document.getElementById('orderQty').value);const msg=document.getElementById('orderMsg');
 if(!link||!quantity){msg.innerText='كمل البيانات';return;}
 const srv=services.find(x=>x.id==service_id);const total=(quantity/1000)*parseFloat(srv.price_per_1000);msg.innerText='جاري...';
 const {error}=await supabaseClient.from('orders').insert({user_id:currentUser.id,service_id,link,quantity,charge:total,status:'pending'});
 if(error){msg.style.color='#ff7675';msg.innerText=error.message;}else{msg.style.color='#00b894';msg.innerText='تم الطلب ✅';loadOrders();}
}
async function loadOrders(){
 const {data}=await supabaseClient.from('orders').select('*,services(name)').eq('user_id',currentUser.id).order('created_at',{ascending:false});
 const c=document.getElementById('ordersList');if(!data||!data.length){c.innerHTML='لا يوجد';return;}
 c.innerHTML=data.map(o=>`<div class="service"><b>${o.services?.name}</b> - ${o.quantity} - $${o.charge}<br><small>${o.link}</small><br><span class="badge">${o.status}</span></div>`).join('');
 if(currentProfile?.role==='admin'){const {data:all}=await supabaseClient.from('orders').select('*,services(name)').order('created_at',{ascending:false}).limit(50);document.getElementById('allOrdersList').innerHTML=(all||[]).map(o=>`<div class="service"><b>${o.services?.name}</b><br>${o.link} - ${o.quantity} - $${o.charge}</div>`).join('');}
}
function switchTab(n,e){document.getElementById('tab-services').classList.add('hidden');document.getElementById('tab-orders').classList.add('hidden');document.getElementById('tab-admin').classList.add('hidden');document.getElementById('tab-'+n).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));if(e)e.target.classList.add('active');}
async function addService(){
 const name=document.getElementById('s_name').value;const category=document.getElementById('s_category').value;const price_per_1000=parseFloat(document.getElementById('s_price').value);const min_order=parseInt(document.getElementById('s_min').value)||100;const max_order=parseInt(document.getElementById('s_max').value)||10000;const description=document.getElementById('s_desc').value;const msg=document.getElementById('adminMsg');
 const {error}=await supabaseClient.from('services').insert({name,category,price_per_1000,min_order,max_order,description});
 if(error){msg.innerText=error.message;msg.style.color='#ff7675';}else{msg.innerText='تمت الإضافة ✅';msg.style.color='#00b894';loadServices();}
}
checkUser();
</script>
</body>
</html>
